name: ros-translator
on:
  pull_request:
    paths:
      - '.github/workflows/ros-translator.yml'
      - '.github/actions/bootstrap/action.yml'
      - '.github/minimal-rmf/**'
      - 'packages/ros-translator/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-rmf/rmf-web/minimal-rmf:rolling-nightly
    defaults:
      run:
        shell: bash
        working-directory: packages/ros-translator
    steps:
      - uses: actions/checkout@v5
      - name: dependencies
        run: apt update && apt install ros-dev-tools -y
      - name: bootstrap
        uses: ./.github/actions/bootstrap
        with:
          package: ros-translator
          skip-build: true
      - name: test
        run: . /opt/ros/rolling/setup.bash && pnpm test
